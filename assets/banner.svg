<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1226"/>
      <stop offset="0.55" stop-color="#0C1428"/>
      <stop offset="1" stop-color="#0A0F1F"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#A96BFF"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.16" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#3D6FD8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3D6FD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.94" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="26" fill="url(#glowL)"/>
  <rect width="1280" height="320" rx="26" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1278" height="318" rx="25" fill="none" stroke="#23335C" stroke-width="2"/>

  <!-- aperture mark -->
  <g transform="translate(64 44) scale(0.226)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#arc)" stroke-width="126"
            stroke-linecap="round" stroke-dasharray="1361 1885" transform="rotate(5 512 512)"/>
    <circle cx="512" cy="512" r="118" fill="url(#arc)"/>
    <circle cx="470" cy="470" r="30" fill="#EAF1FF" opacity="0.9"/>
  </g>

  <text x="300" y="146" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="100" font-weight="bold" fill="#F2F6FF">Basel Anaya</text>
  <text x="303" y="204" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="34" fill="#C9D7F2">Building the infrastructure layer for agents</text>
  <text x="303" y="252" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="27" fill="#64789E">Agents · Security · Markets — all local, all production</text>
</svg>
